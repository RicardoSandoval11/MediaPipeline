syntax = "proto3";

option csharp_namespace = "dotnetservice.Services.Protos";

package file_counter;

service FileCounterService {
    rpc UpsertFileCounterAsync(UpsertFileCounterRequest) returns (UpsertFileCounterResponse);
}

message UpsertFileCounterRequest {
    string userId = 1;
}

message UpsertFileCounterResponse {
    bool success = 1;
    optional bool limitReached = 2;
    optional string error = 3;
}